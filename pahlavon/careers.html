  <!-- Модальное окно отклика на вакансию -->
  <div class="modal" id="applyModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="applyTitle">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel">
      <button class="icon-btn modal__close" data-close aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h3 id="applyTitle" data-i18n="careers.apply.title"></h3>
      <form id="applyForm" novalidate>
        <div class="field">
          <label for="aPosition" data-i18n="careers.apply.position"></label>
          <input type="text" id="aPosition" name="position" readonly>
        </div>
        <div class="field">
          <label for="aName" data-i18n="careers.apply.name"></label>
          <input type="text" id="aName" name="name" autocomplete="name" required>
          <span class="field__err" data-i18n="careers.apply.errName"></span>
        </div>
        <div class="field">
          <label for="aPhone" data-i18n="careers.apply.phone"></label>
          <input type="tel" id="aPhone" name="phone" inputmode="tel" placeholder="+992 ___ __ __ __" required>
          <span class="field__err" data-i18n="careers.apply.errPhone"></span>
        </div>
        <div class="field">
          <label for="aMessage" data-i18n="careers.apply.message"></label>
          <textarea id="aMessage" name="message"></textarea>
        </div>
        <div class="field">
          <label class="consent">
            <input type="checkbox" id="aConsent" name="consent" required>
            <span><span data-i18n="careers.apply.consent"></span> (<a href="privacy.html" target="_blank" data-i18n="footer.privacy"></a>)</span>
          </label>
          <span class="field__err" data-i18n="careers.apply.errConsent"></span>
        </div>
        <button type="submit" class="btn btn--primary btn--block" data-i18n="careers.apply.submit"></button>
      </form>
      <div class="form-success" id="applySuccess">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        <h3 data-i18n="careers.apply.successTitle"></h3>
