<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — страница не найдена | Пахлавон</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>(function(){try{var t=localStorage.getItem("pahlavon-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>

    <div class="container" style="position:relative;z-index:2">
      <div style="font-size:clamp(5rem,18vw,11rem);font-weight:800;line-height:1;color:var(--accent-text)">404</div>
      <h1 style="font-size:clamp(1.4rem,4vw,2rem)">Страница под надёжной охраной не найдена</h1>
      <p style="color:var(--text-muted);max-width:480px;margin:1rem auto 2rem">Похоже, этой страницы не существует или она была перемещена. Вернитесь на главную — там вся защита на месте.</p>
      <a href="index.html" class="btn btn--primary">На главную</a>
    </div>

</html>
